server:
  port: 8080

spring:
  application:
    name: gateway
  # Redis backs the per-client rate limiter (FR-GW-05).
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cloud:
    gateway:
      server:
        webflux:
          # Route by path prefix using discovery (lb://) — no hardcoded hosts (FR-GW-02).
          discovery:
            locator:
              enabled: false
          default-filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                key-resolver: "#{@userKeyResolver}"
          routes:
            - id: customer-service
              uri: lb://customer-service
              predicates:
                - Path=/api/v1/customers/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: customerCircuitBreaker
                    statusCodes: 503
            - id: product-service
              uri: lb://product-service
              predicates:
                - Path=/api/v1/products/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: productCircuitBreaker
            - id: order-service
              uri: lb://order-service
              predicates:
                - Path=/api/v1/orders/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: orderCircuitBreaker
            - id: inventory-service
              uri: lb://inventory-service
              predicates:
                - Path=/api/v1/inventory/**
            - id: payment-service
              uri: lb://payment-service
              predicates:
                - Path=/api/v1/payments/**
            - id: shipping-service
              uri: lb://shipping-service
              predicates:
                - Path=/api/v1/shipments/**
            - id: notification-service
              uri: lb://notification-service
              predicates:
                - Path=/api/v1/notifications/**
            - id: analytics-service
              uri: lb://analytics-service
              predicates:
                - Path=/api/v1/analytics/**
            - id: auth-service
              uri: lb://auth-service
              predicates:
                - Path=/api/v1/auth/**
  security:
    oauth2:
      resourceserver:
        jwt:
          # JWT validation at the edge: signature, issuer, expiry (FR-GW-03).
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/enterprise}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

# Per-route circuit breaker + timeout, returns 503 on open circuit (FR-GW-06).
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 20
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 5
    instances:
      customerCircuitBreaker:
        base-config: default
      productCircuitBreaker:
        base-config: default
      orderCircuitBreaker:
        base-config: default
  timelimiter:
    configs:
      default:
        timeout-duration: 3s

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,gateway
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  pattern:
    # Structured correlation fields for every log line (FR-GW-04, NFR-OBS-03).
    level: "%5p [${spring.application.name},traceId=%X{traceId:-},spanId=%X{spanId:-},corrId=%X{correlationId:-}]"
